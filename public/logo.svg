<svg width="320" height="70" viewBox="0 0 320 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold-metallic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8" />
      <stop offset="40%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8b6914" />
    </linearGradient>
  </defs>

  <!-- Skewed Text Group -->
  <g transform="skewX(-6) translate(6, 0)">
    <!-- Shadow Text -->
    <text
      x="160"
      y="47"
      text-anchor="middle"
      fill="#100d05"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-weight="800"
      font-size="36"
      letter-spacing="0.12em"
    >
      GAMBITS
    </text>

    <!-- Main Text -->
    <text
      x="160"
      y="45"
      text-anchor="middle"
      fill="url(#gold-metallic)"
      stroke="#1a1508"
      stroke-width="0.5"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-weight="800"
      font-size="36"
      letter-spacing="0.12em"
    >
      GAMBITS
    </text>
  </g>

  <!-- Diagonal Slash -->
  <path
    d="M 268 14 L 52 56"
    stroke="url(#gold-metallic)"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
